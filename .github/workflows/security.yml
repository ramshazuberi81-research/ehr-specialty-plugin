name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly, so newly disclosed dependency issues show up even without a commit
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit bandit
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.txt
      - name: Common Python security issues (medium and above)
        run: bandit -q -r app -ll
