<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0d7377">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Ask the chart (synthetic-data prototype)</title>
<style>body{font:16px system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem}
input,button{font:inherit;padding:.5rem}#q{width:100%;box-sizing:border-box}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem}
.warn{background:#fff3cd;padding:.5rem}</style>
<h1>Ask the chart</h1>
<p class="warn">Prototype. Synthetic data only. Saying a name is not authentication.</p>
<p><label>Access secret <input id="s" type="password"></label></p>
<p><input id="q" placeholder="e.g. show records for Jane Doe, born 1980-02-03"></p>
<p><button id="go">Ask</button> <button id="mic">Speak</button></p>
<pre id="out"></pre>
<script>
const out=document.getElementById('out'),q=document.getElementById('q');
async function ask(){
  out.textContent='...';
  const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json','X-Webhook-Secret':document.getElementById('s').value},body:JSON.stringify({text:q.value})});
  const j=await r.json();
  if(!r.ok){out.textContent=r.status+': '+(j.detail||'error');return}
  if(j.status==='records'){out.textContent=j.summaries.map(s=>s.text).join('\n\n')||'Patient found, no filed records.'}
  else if(j.status==='ambiguous'){out.textContent=j.message+'\n'+j.candidates.map(c=>'- '+c.name+' (born '+(c.birthDate||'?')+')').join('\n')}
  else{out.textContent=j.message}
}
document.getElementById('go').onclick=ask;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){document.getElementById('mic').onclick=()=>{const r=new SR();r.onresult=e=>{q.value=e.results[0][0].transcript;ask()};r.start()}}
else{document.getElementById('mic').disabled=true}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script>
