# Render Blueprint: deploys the DEMO (fake synthetic patients, in-memory). Synthetic data only.
services:
  - type: web
    name: ask-the-chart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/demo_app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: WEBHOOK_SECRET
        generateValue: true        # Render makes a random secret; read it in the dashboard under Environment
      # - key: ANTHROPIC_API_KEY   # add in the dashboard (not here) to use the real model
